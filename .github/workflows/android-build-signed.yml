name: Android Build (Signed)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Download Gradle Wrapper JAR
      run: |
        mkdir -p gradle/wrapper
        curl -L https://raw.githubusercontent.com/gradle/gradle/v8.2.0/gradle/wrapper/gradle-wrapper.jar -o gradle/wrapper/gradle-wrapper.jar

    - name: Fix gradlew permissions
      run: chmod +x gradlew

    - name: Decode Keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        echo "$KEYSTORE_BASE64" | base64 -d > app/keystore.jks
        echo "✅ Keystore decoded"
        file app/keystore.jks

    - name: Create signing configuration file
      run: |
        cat > app/signing.properties << 'EOF'
        storeFile=keystore.jks
        storePassword=${{ secrets.KEYSTORE_PASSWORD }}
        keyAlias=${{ secrets.KEY_ALIAS }}
        keyPassword=${{ secrets.KEY_PASSWORD }}
        EOF
        echo "✅ signing.properties created"

    - name: Build Signed APK
      run: |
        ./gradlew assembleRelease --no-daemon \
          -Pandroid.injected.signing.store.file=$PWD/app/keystore.jks \
          -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
          -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
          -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }} \
          -Prelease

    - name: Verify APK is signed
      run: |
        if [ -f app/build/outputs/apk/release/app-release.apk ]; then
          echo "✅ APK found"
          unzip -l app/build/outputs/apk/release/app-release.apk | grep -E "META-INF.*.(RSA|DSA|EC)" || echo "⚠️ No signature found"
        else
          echo "❌ APK not found"
          exit 1
        fi

    - name: Upload Signed APK
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: GeoSurveyToolbox-Signed
        path: app/build/outputs/apk/release/*.apk
        retention-days: 30
