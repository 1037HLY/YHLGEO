name: Android Build (Signed)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Download Gradle Wrapper JAR
      run: |
        mkdir -p gradle/wrapper
        curl -L https://raw.githubusercontent.com/gradle/gradle/v8.2.0/gradle/wrapper/gradle-wrapper.jar -o gradle/wrapper/gradle-wrapper.jar

    - name: Fix gradlew permissions
      run: chmod +x gradlew

    - name: Decode Keystore to root directory
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        # 将密钥文件解码到项目根目录（不是app目录）
        echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks
        echo "✅ Keystore decoded to root directory"
        ls -la keystore.jks

    - name: Build Signed APK
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        # 使用项目根目录的密钥文件
        ./gradlew assembleRelease --no-daemon \
          -Pandroid.injected.signing.store.file=$PWD/keystore.jks \
          -Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD \
          -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
          -Pandroid.injected.signing.key.password=$KEY_PASSWORD

    - name: Verify APK
      run: |
        if [ -f app/build/outputs/apk/release/app-release.apk ]; then
          echo "✅ APK built successfully"
          ls -la app/build/outputs/apk/release/
        else
          echo "❌ APK not found"
          exit 1
        fi

    - name: Upload Signed APK
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: GeoSurveyToolbox-Signed
        path: app/build/outputs/apk/release/*.apk
        retention-days: 30
