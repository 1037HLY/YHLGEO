name: Android Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Download Gradle Wrapper JAR
      run: |
        mkdir -p gradle/wrapper
        curl -L https://raw.githubusercontent.com/gradle/gradle/v8.2.0/gradle/wrapper/gradle-wrapper.jar -o gradle/wrapper/gradle-wrapper.jar
        echo "✅ gradle-wrapper.jar downloaded"

    - name: Fix gradlew permissions
      run: |
        chmod +x gradlew
        ls -la gradlew

    - name: Build APK
      run: |
        ./gradlew assembleRelease --no-daemon

    - name: Upload APK - Release
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: GeoSurveyToolbox-APK
        path: app/build/outputs/apk/release/*.apk
        retention-days: 30

    - name: Upload APK - Debug
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: GeoSurveyToolbox-APK-Debug
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 30

    - name: Upload Mapping File
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: ProGuard-Mapping
        path: app/build/outputs/mapping/release/mapping.txt
        retention-days: 30
